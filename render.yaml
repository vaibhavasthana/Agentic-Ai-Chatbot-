services:
  - type: web
    name: demand-chatbot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn App:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: AZURE_SQL_SERVER
        sync: false
      - key: AZURE_SQL_DATABASE
        sync: false
      - key: AZURE_SQL_USERNAME
        sync: false
      - key: AZURE_SQL_PASSWORD
        sync: false
